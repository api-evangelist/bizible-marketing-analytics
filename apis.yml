name: Bizible Marketing Analytics
description: Bizible was a B2B marketing attribution and revenue analytics platform that connected marketing
  activity to pipeline and revenue across advertising, web, CRM, and marketing-automation channels. Acquired
  by Marketo in 2018 and subsequently by Adobe, the product now ships as Adobe Marketo Measure (formerly
  Bizible); the bizible.com domain 301-redirects to Adobe and its product documentation has moved to the
  Adobe Experience League. It has no standalone public developer portal, OpenAPI, or API reference of its
  own — integration is handled through Adobe/Marketo Measure and CRM connectors.
