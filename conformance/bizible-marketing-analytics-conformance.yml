standards:
- id: gdpr-consent
  conforms: true
  evidence: >-
    bizible.js supports consent-gated tracking. With data-requires-user-consent="true" on the
    <script id="bizible-settings"> tag the script does not track until Bizible.Push('Consent', true)
    is called; Bizible.Push('Consent', false) withdraws it. An alternative data-consent-button-id
    attribute binds consent to a click on a named element. Documented by the provider.
  docs: https://experienceleague.adobe.com/en/docs/marketo-measure/using/security-and-compliance/compliance-related-resources/ensuring-consent-for-gdpr-in-marketo-measure-js
