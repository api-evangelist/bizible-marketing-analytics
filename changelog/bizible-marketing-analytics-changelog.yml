entries:
- version: Q4 Release
  date: '2024-10'
  breaking: false
  highlights:
  - Session Channel Carryover — previous session channels carry over within 7 days for Direct visits.
  - Keyword ROI Dashboard for analyzing keyword performance across paid search platforms.
  - Campaign and Campaign Member fields added to segment rules.
  - CRM export error handling toggle pauses jobs on error (default enabled, activated October 1).
- version: Q3 Release
  date: '2024-06'
  breaking: true
  additions:
  - Attributed Opportunity Dashboard tracking marketing contribution to pipeline.
  - Marketo Engage cookie sync for Marketo Measure Ultimate customers.
  - Boomerang Stages extended from Tier 3 to Tier 2 customers.
  deprecations:
  - Salesforce field deprecations — export jobs to Lead/Contact objects phased out to cut API cost ~10%.
- version: Q2 Release
  date: '2024-04'
  breaking: true
  additions:
  - In-app pulse notifications for permission errors.
  deprecations:
  - Cross-Domain Tracking and View-through Attribution phased out by June 1 with third-party cookie deprecation.
  - LinkedIn integration required re-authentication by May 20.
